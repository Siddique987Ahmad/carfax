# Local services for development. Start with `pnpm services:up` (or just `pnpm dev`).
# Credentials here are for local use only and match .env.example.
name: carfax

services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: carfax
      POSTGRES_PASSWORD: carfax
      POSTGRES_DB: carfax
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carfax -d carfax']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible storage standing in for Cloudflare R2 (photos and report PDFs).
  # SeaweedFS replaces MinIO, which stopped publishing Docker images in 2025.
  s3:
    image: chrislusf/seaweedfs:4.53
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.volumeSizeLimitMB=256
    ports:
      - '8333:8333'
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8333/healthz']
      interval: 2s
      timeout: 3s
      retries: 60

  # One-off job: creates the private buckets, then exits. Safe to run again.
  # It sits in the "init" profile so `up --wait` doesn't treat its exit as a failure;
  # `pnpm services:up` runs it separately with `compose run`.
  s3-init:
    image: chrislusf/seaweedfs:4.53
    profiles: ['init']
    depends_on:
      s3:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        for b in photos reports; do
          echo "s3.bucket.list" | weed shell -master=s3:9333 | grep -qw "$$b" \
            || echo "s3.bucket.create -name $$b" | weed shell -master=s3:9333
        done
        echo "buckets ready"

volumes:
  postgres-data:
  redis-data:
  s3-data:
